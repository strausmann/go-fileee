<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1000" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="1000" fill="#ffffff"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#0f172a">go-fileee — Auth-Flow: EnsureSession(ctx, creds)</text>
  <text x="40" y="70" font-size="13.5" fill="#64748b">Login-einmal · Cookie wiederverwenden · Auto-Re-Login. Der Aufrufer (CLI/MCP/Scanner) sieht davon nichts.</text>

  <!-- main column boxes cx=300, w=340 -->
  <!-- b1 start -->
  <rect x="130" y="96" width="340" height="46" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="300" y="124" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e3a8a">App → EnsureSession(ctx, creds)</text>

  <!-- b2 -->
  <rect x="130" y="176" width="340" height="46" rx="9" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/>
  <text x="300" y="204" text-anchor="middle" font-size="13" fill="#1e293b">SessionStore.Load() → Cookie von Platte</text>

  <!-- b3 probe -->
  <rect x="130" y="256" width="340" height="46" rx="9" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/>
  <text x="300" y="284" text-anchor="middle" font-size="13" fill="#1e293b">GET /api/f/user-session  (probe)</text>

  <!-- d4 decision diamond center (300,352) -->
  <polygon points="300,318 392,352 300,386 208,352" fill="#fde68a" stroke="#b45309" stroke-width="1.6"/>
  <text x="300" y="357" text-anchor="middle" font-size="13" font-weight="600" fill="#78350f">authorized:true ?</text>

  <!-- yes branch -> green box right -->
  <rect x="560" y="329" width="360" height="46" rx="9" fill="#bbf7d0" stroke="#15803d" stroke-width="1.6"/>
  <text x="740" y="357" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14532d">✓ Session gültig — sofort fertig</text>

  <!-- b5 -->
  <rect x="130" y="426" width="340" height="46" rx="9" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/>
  <text x="300" y="454" text-anchor="middle" font-size="13" fill="#1e293b">GET /api/f/start → XSRF-TOKEN (Bootstrap)</text>

  <!-- b6 -->
  <rect x="130" y="506" width="340" height="46" rx="9" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/>
  <text x="300" y="534" text-anchor="middle" font-size="13" fill="#1e293b">POST /api/f/existent {username}  (2FA?)</text>

  <!-- b7 totp -->
  <rect x="130" y="586" width="340" height="46" rx="9" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="300" y="614" text-anchor="middle" font-size="13" font-weight="600" fill="#4c1d95">TOTP-Code aus Seed (RFC 6238 / pquerna-otp)</text>

  <!-- b8 login -->
  <rect x="130" y="666" width="340" height="46" rx="9" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/>
  <text x="300" y="694" text-anchor="middle" font-size="13" fill="#1e293b">POST /api/f/login  (+ two-factor-token)</text>

  <!-- b9 -->
  <rect x="130" y="746" width="340" height="46" rx="9" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/>
  <text x="300" y="774" text-anchor="middle" font-size="13" fill="#1e293b">Set-Cookie: session + XSRF-TOKEN</text>

  <!-- b10 -->
  <rect x="130" y="826" width="340" height="46" rx="9" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/>
  <text x="300" y="854" text-anchor="middle" font-size="13" fill="#1e293b">SessionStore.Save()  (Datei chmod 0600)</text>

  <!-- b11 end -->
  <rect x="130" y="906" width="340" height="46" rx="9" fill="#bbf7d0" stroke="#15803d" stroke-width="1.6"/>
  <text x="300" y="934" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14532d">✓ eingeloggt — Cookie aktiv</text>

  <!-- arrows main -->
  <g stroke="#475569" stroke-width="1.6" fill="none">
    <line x1="300" y1="142" x2="300" y2="174" marker-end="url(#arw)"/>
    <line x1="300" y1="222" x2="300" y2="254" marker-end="url(#arw)"/>
    <line x1="300" y1="302" x2="300" y2="316" marker-end="url(#arw)"/>
    <line x1="300" y1="386" x2="300" y2="424" marker-end="url(#arw)"/>
    <line x1="300" y1="472" x2="300" y2="504" marker-end="url(#arw)"/>
    <line x1="300" y1="552" x2="300" y2="584" marker-end="url(#arw)"/>
    <line x1="300" y1="632" x2="300" y2="664" marker-end="url(#arw)"/>
    <line x1="300" y1="712" x2="300" y2="744" marker-end="url(#arw)"/>
    <line x1="300" y1="792" x2="300" y2="824" marker-end="url(#arw)"/>
    <line x1="300" y1="872" x2="300" y2="904" marker-end="url(#arw)"/>
    <!-- yes branch -->
    <line x1="392" y1="352" x2="558" y2="352" marker-end="url(#arw)"/>
  </g>
  <text x="315" y="412" font-size="12.5" font-weight="700" fill="#b45309">nein</text>
  <text x="452" y="345" font-size="12.5" font-weight="700" fill="#15803d">ja</text>

  <!-- automatics side note -->
  <rect x="560" y="520" width="380" height="196" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="580" y="548" font-size="14" font-weight="700" fill="#0f172a">Automatik im Transport-Layer</text>
  <text x="580" y="578" font-size="12.8" fill="#334155">•  x-xsrf-token bei POST / PUT / DELETE</text>
  <text x="580" y="604" font-size="12.8" fill="#334155">•  401 / authorized:false → 1× Re-Login</text>
  <text x="596" y="624" font-size="12.8" fill="#64748b">   (mutex-geschützt, kein Stampede)</text>
  <text x="580" y="650" font-size="12.8" fill="#334155">•  TOTP-Randfall → 1× frischer Code</text>
  <text x="580" y="676" font-size="12.8" fill="#334155">•  secondsBlocked&gt;0 → ErrBlocked + Backoff</text>
  <text x="580" y="702" font-size="12.8" fill="#334155">•  Lib kennt keinen Vault — Creds kommen rein</text>
</svg>
