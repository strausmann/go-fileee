name: release
on:
  schedule:
    - cron: "0 3 * * *"   # taeglich 03:00 UTC — Kaskade 2/4: go-fileee Release (nach eigenem Renovate). NIE on push.
  workflow_dispatch:
permissions: { contents: write, issues: write, pull-requests: write }
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # SSH-Deploy-Key: semantic-release pusht CHANGELOG+Tag ueber SSH (repositoryUrl in
          # .releaserc.json ist SSH). Der Deploy-Key ist Bypass-Actor im main-Ruleset -> Push
          # kommt an protected main vorbei, ohne dass GITHUB_TOKEN/Bot bypassen muss.
          ssh-key: "${{ secrets.SSH_DEPLOY_KEY }}"
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: npm ci
      - env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: npx semantic-release
